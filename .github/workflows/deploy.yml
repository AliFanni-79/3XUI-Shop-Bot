name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if commit matches (--force)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Auto-Update Server
    # Only deploy on official releases (ignoring automated pre-releases) or manual trigger
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Update via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${SPEEDYBOT_APP_DIR:-/root/SpeedyBot}"
            echo "🚀 Connecting to server for X-UI Shop Bot update..."
            cd "$APP_DIR"
            
            if [ "${{ inputs.force_update }}" = "true" ]; then
              echo "⚙️ Running update.sh with --force flag..."
              bash update.sh --force
            else
              echo "⚙️ Running update.sh..."
              bash update.sh
            fi
            
            echo "✅ X-UI Shop Bot auto-update completed successfully!"
