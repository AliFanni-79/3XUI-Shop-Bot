name: X-UI Shop Bot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Manual Release Bump (choose minor or major to release latest)'
        required: true
        type: choice
        default: 'minor'
        options:
          - minor
          - major

permissions:
  contents: write

jobs:
  syntax:
    name: Syntax & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile main.py restore.py xuishop/*.py scripts/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n upgrade.sh
          bash -n restore.sh
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Webapp build check
        run: |
          npm --prefix webapp ci || npm --prefix webapp install
          npm --prefix webapp run build
      - name: Integrated layout
        run: |
          test -f main.py
          test -f xuishop/core.py
          test -f xuishop/admin_tools.py
          test -f xuishop/admin_ux.py
          test ! -e app.py
          test ! -e speedybot_v4
      - name: Version file
        run: |
          test -f VERSION.txt
          python -c 'import xuishop; assert xuishop.VERSION == open("VERSION.txt").read().strip()'

  prerelease:
    name: Auto Pre-release
    needs: syntax
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bump Pre-release Version
        run: |
          python scripts/bump_version.py --mode prerelease
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Webapp Assets
        run: |
          npm --prefix webapp ci || npm --prefix webapp install
          npm --prefix webapp run build
      - name: Commit and Push Pre-release Version
        run: |
          NEW_VER=$(cat VERSION.txt | tr -d '[:space:]')
          TAG="v${NEW_VER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt xuishop/__init__.py webapp/package.json webapp/dist
          if ! git diff --cached --quiet; then
            git commit -m "chore(prerelease): bump to ${TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Create or update Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER=$(cat VERSION.txt | tr -d '[:space:]')
          TAG="v${NEW_VER}"
          echo "Processing pre-release for ${TAG}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, ensuring it is marked as prerelease..."
            gh release edit "$TAG" --prerelease
          else
            echo "Creating new prerelease for $TAG..."
            gh release create "$TAG" \
              --title "$TAG (Pre-release)" \
              --prerelease \
              --generate-notes
          fi

  release_minor:
    name: Release Latest (Minor Bump)
    needs: syntax
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'minor'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bump Minor Version and Remove Patch
        run: |
          python scripts/bump_version.py --mode minor
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Webapp Assets
        run: |
          npm --prefix webapp ci || npm --prefix webapp install
          npm --prefix webapp run build
      - name: Commit and Push Release Version
        run: |
          NEW_VER=$(cat VERSION.txt | tr -d '[:space:]')
          TAG="v${NEW_VER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt xuishop/__init__.py webapp/package.json webapp/dist
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): release ${TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Create Official Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER=$(cat VERSION.txt | tr -d '[:space:]')
          TAG="v${NEW_VER}"
          echo "Creating official latest release for ${TAG}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest --prerelease=false --title "$TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --latest \
              --generate-notes
          fi
      - name: Trigger Production Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy.yml workflow..."
          gh workflow run deploy.yml || true

  release_major:
    name: Release Latest (Major Bump)
    needs: syntax
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'major'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bump Major Version and Remove Patch
        run: |
          python scripts/bump_version.py --mode major
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Webapp Assets
        run: |
          npm --prefix webapp ci || npm --prefix webapp install
          npm --prefix webapp run build
      - name: Commit and Push Release Version
        run: |
          NEW_VER=$(cat VERSION.txt | tr -d '[:space:]')
          TAG="v${NEW_VER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt xuishop/__init__.py webapp/package.json webapp/dist
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): release ${TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Create Official Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER=$(cat VERSION.txt | tr -d '[:space:]')
          TAG="v${NEW_VER}"
          echo "Creating official latest release for ${TAG}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest --prerelease=false --title "$TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --latest \
              --generate-notes
          fi
      - name: Trigger Production Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy.yml workflow..."
          gh workflow run deploy.yml || true
