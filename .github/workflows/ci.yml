name: X-UI Shop Bot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile main.py restore.py xuishop/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n upgrade.sh
          bash -n restore.sh
      - name: Integrated layout
        run: |
          test -f main.py
          test -f xuishop/core.py
          test -f xuishop/admin_tools.py
          test -f xuishop/admin_ux.py
          test ! -e app.py
          test ! -e speedybot_v4
      - name: Version file
        run: |
          test -f VERSION.txt
          python -c 'import xuishop; assert xuishop.VERSION == open("VERSION.txt").read().strip()'

  prerelease:
    name: Auto Pre-release
    needs: syntax
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or update Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION.txt | tr -d '[:space:]')
          TAG="v${VERSION}"
          echo "Processing pre-release for ${TAG}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, ensuring it is marked as prerelease..."
            gh release edit "$TAG" --prerelease
          else
            echo "Creating new prerelease for $TAG..."
            gh release create "$TAG" \
              --title "$TAG (Pre-release)" \
              --prerelease \
              --generate-notes
          fi

